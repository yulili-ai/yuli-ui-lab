<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实 Codex 执行记录 · Yuli UI</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#242830;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:40px 24px}a{color:#3455d1}h1{font-size:30px}h2{font-size:19px}p{line-height:1.8;color:#697384}.links{display:flex;flex-wrap:wrap;gap:20px;margin:24px 0}.summary,section,details{background:white;border:1px solid #e4e7ec;padding:20px;border-radius:12px;margin:16px 0}summary{cursor:pointer;font-size:13px;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.8;padding:16px;background:#f5f7fb;border-radius:8px;max-height:500px;overflow:auto}.summary{color:#3455d1;font-weight:600}.badge{font-size:11px;color:#687181}footer{margin-top:30px;color:#89909c;font-size:12px}</style></head><body><main><span class="badge">YULI / NATIVE CODEX RUN</span><h1>从输入需求，到真实 AI 生成。</h1><p>以下为 2026 年 11 月 12 日真实 Codex CLI 执行记录的公开节选，本机路径已移除。原生 MCP 由当时的 Codex 会话直接调用；此页只展示历史证据，不执行 AI，也不会随访客操作更新。</p><div class="links"><a href="./?demo=live">打开本次生成页面 ↗</a><a href="./">回到统一入口</a></div><div class="summary" id="status" role="status">正在读取执行记录…</div><section><h2>输入需求</h2><pre id="request"></pre></section><section><h2>执行检查</h2><div id="checks"></div></section><h2>原生 MCP 调用</h2><div id="calls"></div><footer>首轮曾因非交互审批设置失败；调整执行方式后重跑。公开内容为后续成功执行的节选，原始日志保留在本地。业务数据均为示例，不表示团队实际交付成果。</footer></main><script type="module">
const add=(tag,parent,text)=>{const node=document.createElement(tag);node.textContent=text;parent.append(node);return node};
try{const response=await fetch('./live-proof.json',{cache:'no-store'});if(!response.ok)throw Error('尚未生成记录');const data=await response.json();document.getElementById('status').textContent=`${data.status==='completed'?'AI 执行已结束':'AI 执行记录更新中'} · ${data.calls.filter(c=>c.status==='completed').length} 次成功的原生 MCP 调用 · Skill: ${data.skill}`;document.getElementById('request').textContent=data.request;for(const check of data.checks){add('pre',document.getElementById('checks'),`${check.command}\n退出码：${check.exitCode}\n${check.output??''}`)}if(!data.checks.length)add('p',document.getElementById('checks'),'尚无构建结果。');data.calls.forEach((call,index)=>{const details=add('details',document.getElementById('calls'),'');add('summary',details,`${String(index+1).padStart(2,'0')} · ${call.server} / ${call.tool} · ${call.status}`);add('pre',details,JSON.stringify({arguments:call.arguments,result:call.result,error:call.error},null,2))})}catch(error){document.getElementById('status').textContent=error.message}
</script></body></html>
